<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>THE RULES ARE LYING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/extra.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="world"></canvas>

    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="hud">
      <p class="mark">THE RULES ARE LYING</p>
      <p class="tally" id="tally">0</p>
    </header>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <p class="hint" id="hint"></p>

    <div id="os" class="os" hidden>
      <div class="icons" id="icons"></div>
      <div class="windows" id="windows"></div>
      <footer class="taskbar">
        <button type="button" class="start" id="startBtn">the game</button>
        <div class="tasks" id="tasks"></div>
        <button type="button" class="clock" id="clock">12:00</button>
      </footer>
    </div>

    <div id="stage" class="stage" hidden></div>

    <section class="title" id="title">
      <h1>THE RULES ARE LYING</h1>
      <p class="whisper">nothing here is what it claims</p>
      <button type="button" id="begin">enter</button>
    </section>

    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="tear" id="tear" aria-hidden="true"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
